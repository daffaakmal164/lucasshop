<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucasshop Bengkel Motor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@500&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#16140F;--cd:#221F18;--bd:#3A352A;--y:#FFC400;--o:#F26B1D;--t:#D9C9A0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 Inter,Arial,sans-serif}
a{color:inherit;text-decoration:none}
h1,h2,h3,p{margin:0}
.hz{height:14px;background:repeating-linear-gradient(-45deg,var(--y) 0 14px,var(--bg) 14px 28px)}
.ttl{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:3px;color:var(--y);line-height:1;font-weight:400}
.sub{font-family:Oswald,'Arial Narrow',sans-serif;font-weight:500;letter-spacing:2px;color:var(--y)}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.top{display:flex;align-items:center;gap:10px;padding:12px 24px;flex-wrap:wrap;border-bottom:2px solid var(--bd)}
.top .sp{flex:1}
.pill{padding:8px 18px;border-radius:99px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;cursor:pointer;border:0;background:none;color:var(--t);font-size:15px}
.pill.on{background:var(--o);color:var(--bg)}
.pill.cta,.b{background:var(--y);color:var(--bg)}
.b{border:0;border-radius:4px;font:600 16px Inter,sans-serif;padding:10px 20px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.b:hover,.pill.cta:hover{background:var(--o)}
.b.s{background:none;color:var(--y);border:2px solid var(--y)}
.b.r{background:none;color:#FF8A5C;border:2px solid #FF8A5C}
.b.sm{min-height:36px;padding:6px 12px;font-size:14px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.c{background:var(--cd);border:2px solid var(--bd);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px}
.c h3{font-family:Oswald,Arial,sans-serif;font-weight:500;font-size:22px;color:var(--y);letter-spacing:1px}
.ph{aspect-ratio:4/3;width:100%;background:#2A261D;border-radius:4px;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--bd);font:500 14px Oswald,sans-serif;letter-spacing:3px}
.f{display:flex;flex-direction:column;gap:6px}
.f label{font-size:14px}
input,select,textarea{background:var(--bg);border:2px solid #4A4436;border-radius:4px;color:var(--t);font:400 16px Inter,sans-serif;padding:10px 12px;min-height:44px;width:100%}
input[type=radio],input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--y)}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.role{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--bd);border-radius:6px;padding:12px 14px;cursor:pointer}
.role:has(input:checked){border-color:var(--y)}
.role b{color:var(--y);font:500 18px Oswald,sans-serif}.role small{display:block;font-size:13px}
.ban{background:var(--o);color:var(--bg);padding:28px 24px}
.ban .in{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.ban .ttl{color:var(--bg);font-size:44px}
.panel{display:grid;grid-template-columns:200px 1fr;min-height:70vh}
.side{border-right:2px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:6px}
.side .pill{justify-content:flex-start;border-radius:6px}
.main{padding:24px;min-width:0;display:flex;flex-direction:column;gap:20px}
.stat{font:400 44px 'Bebas Neue',sans-serif;color:var(--y);letter-spacing:2px;line-height:1}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--bd);font-size:15px;vertical-align:middle}
th{color:var(--y);font-weight:600}
.tag{font-size:12px;font-weight:600;border-radius:3px;padding:2px 8px;background:var(--bd)}
footer{background:#F4EFE6;color:#16140F;padding:24px;margin-top:48px}
footer .in{max-width:1200px;margin:auto;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--y);color:var(--bg);padding:10px 20px;border-radius:6px;font-weight:600;display:none;z-index:9}
@media(max-width:760px){.panel{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--bd)}}
.ov{position:fixed;inset:0;background:rgba(10,9,6,.88);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20;overflow:auto}
.gal{background:var(--cd);border:2px solid var(--bd);border-radius:6px;padding:16px;max-width:760px;width:100%;display:flex;flex-direction:column;gap:12px}
.gal>img{width:100%;max-height:60vh;object-fit:contain;background:var(--bg);border-radius:4px}
.th{display:flex;gap:8px;overflow-x:auto}
.th button{border:2px solid var(--bd);background:none;padding:0;border-radius:4px;cursor:pointer;flex:none}
.th button.on{border-color:var(--y)}
.th img{width:64px;height:48px;object-fit:cover;display:block}
.paper{background:#fff;color:#000;width:80mm;max-width:92vw;padding:12px;font:12px/1.45 'Courier New',monospace}
.paper hr{border:0;border-top:1px dashed #000;margin:8px 0}
.paper .r{display:flex;justify-content:space-between;gap:8px}
@media print{body{background:#fff!important}body:not(.pr) #app>*:not(.ov){display:none!important}body.pr .side,body.pr .top,body.pr .hz,body.pr .noprint{display:none!important}body.pr .panel{display:block}body.pr .main{padding:0}body.pr .rpt,body.pr .rpt *{color:#000!important;background:transparent!important;border-color:#888!important}body.pr table{min-width:0}.ov{position:static;background:none;padding:0;display:block;overflow:visible}.noprint,#toast{display:none!important}.paper{width:100%;max-width:none;padding:0}@page{size:80mm auto;margin:4mm}}
#sform{display:none}#sform.open{display:flex}#sform input{width:180px;min-height:40px}
#mnav{display:flex;gap:8px;flex-wrap:wrap}#hamb{display:none}
@media(max-width:760px){#hamb{display:inline-flex}#mnav{display:none;width:100%;order:9}#mnav.open{display:flex}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" role="status"></div>
<script>
let db={products:[],services:[],cfg:{}};
async function api(url,o={}){const r=await fetch(url,{method:o.m||'GET',headers:o.b?{'Content-Type':'application/json'}:{},body:o.b?JSON.stringify(o.b):undefined,credentials:'same-origin'});let j={};try{j=await r.json()}catch(e){}if(!r.ok){if(r.status===401&&me){me=null;S.tab='dash';toast('Sesi berakhir karena tidak aktif. Silakan masuk lagi.');location.hash='#/login'}else toast(j.error||'Terjadi kesalahan. Coba lagi.');throw new Error(j.error||'error')}return j}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const ymd=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>ymd(new Date()),dAgo=n=>ymd(new Date(Date.now()-n*864e5));
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)};
const ST=['Menunggu','Dikerjakan','Selesai','Batal'];
let me=null;
let S={tab:'dash',qd:today(),rd:today(),rm:today().slice(0,7),rmode:'day',edit:null,editC:null,editU:null,cart:[],done:null,regF:{},regCust:'',regVeh:undefined,sp:null,bill:null};
const phone=v=>{let d=String(v||'').replace(/\D/g,'');if(d.startsWith('0'))d='62'+d.slice(1);else if(d.startsWith('8'))d='62'+d;return d};
const waMsgLink=b=>'https://wa.me/'+phone(b.wa)+'?text='+encodeURIComponent(String(db.cfg.waDone||'').replace(/\{nama\}/g,b.name).replace(/\{motor\}/g,b.motor).replace(/\{layanan\}/g,b.service||'').replace(/\{jam\}/g,db.cfg.jam));
const img=(p,n)=>p?`<img class="ph" src="${p}" alt="${esc(n)}">`:`<div class="ph" aria-hidden="true">FOTO</div>`;
const waLink=()=>{const d=String(db.cfg.wa).replace(/\D/g,'');return d?'https://wa.me/'+d:'#/booking'};
const nameOf=(arr,id)=>(arr.find(x=>x.id===id)||{name:'(dihapus)'}).name;
function resize(file){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const m=520,k=Math.min(1,m/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=fr.result};fr.readAsDataURL(file)})}

/* ===== tampilan pengunjung ===== */
const logo=(sz=36)=>`<a href="#/" class="ttl" style="font-size:${sz}px">LUCAS<span style="color:var(--o)">SHOP</span></a>`;
const gear=z=>`<svg width="${z}" height="${z}" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="78" fill="none" stroke="#FFC400" stroke-width="22" stroke-dasharray="10.2 10.2"/><circle cx="100" cy="100" r="68" fill="#FFC400"/><circle cx="100" cy="100" r="58" fill="#16140F"/><g transform="rotate(45 100 100)" fill="#F26B1D"><rect x="94" y="60" width="12" height="80" rx="6"/><circle cx="100" cy="64" r="14"/><rect x="95" y="48" width="10" height="16" fill="#16140F"/><circle cx="100" cy="136" r="14"/><rect x="95" y="136" width="10" height="16" fill="#16140F"/></g><g transform="rotate(-45 100 100)" fill="#F26B1D" stroke="#16140F" stroke-width="3" paint-order="stroke"><rect x="94" y="60" width="12" height="80" rx="6"/><circle cx="100" cy="64" r="14"/><rect x="95" y="48" width="10" height="16" fill="#16140F" stroke="none"/><circle cx="100" cy="136" r="14"/><rect x="95" y="136" width="10" height="16" fill="#16140F" stroke="none"/></g></svg>`;
const IC={search:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',user:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',menu:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>'};
const brand=`<a href="#/" style="display:flex;align-items:center;gap:8px">${gear(38)}<span><span class="ttl" style="font-size:30px;display:block">LUCAS<span style="color:var(--o)">SHOP</span></span><span style="display:block;font-size:9px;letter-spacing:4px">BENGKEL MOTOR</span></span></a>`;
function navbar(p){
const L=[['','Beranda','home'],['produk','Product','produk'],['layanan','Service','layanan']].map(l=>`<a class="pill${p===l[2]?' on':''}" href="#/${l[0]}">${l[1]}</a>`).join('');
return`<div class="hz"></div><header class="top">${brand}<div class="sp"></div><form data-f="search" id="sform"><input name="q" aria-label="Cari produk" placeholder="Cari produk"></form><button class="pill" data-a="srch" aria-label="Cari produk">${IC.search}</button><nav id="mnav">${L}<a class="pill cta${p==='booking'?' on':''}" href="#/booking">Booking Servis</a></nav><button class="pill" id="hamb" data-a="menu" aria-label="Menu">${IC.menu}</button><a class="pill" href="#/${me?me.role:'login'}" aria-label="${me?'Buka panel '+me.role:'Masuk'}">${IC.user}${me?' '+esc(me.name):''}</a></header>`}
function foot(){const c=db.cfg;return`<footer><div class="in"><div>${logo(30).replace('var(--y)','#16140F')}<div style="letter-spacing:5px;font-size:12px;margin-top:4px">BENGKEL MOTOR</div></div><div><b>PT Lucasshop Motor</b><br>${esc(c.alamat)}<br>WhatsApp: ${esc(c.wa)}<br>Email: ${esc(c.email)}<br>Jam buka: ${esc(c.jam)}</div></div></footer>`}
function home(){const c=db.cfg;return`<section class="wrap" style="padding-top:56px;padding-bottom:40px;display:flex;flex-direction:column;gap:18px"><div class="sub" style="font-size:20px">Promo Sparepart Motor Anda</div><h1 class="ttl" style="font-size:clamp(48px,9vw,104px);max-width:900px">${esc(c.hero)}</h1><p style="max-width:560px;font-size:18px">Oli, kampas rem, ban, aki, dan perlengkapan motor lainnya. Pasang langsung di bengkel Lucasshop.</p><div style="display:flex;gap:12px;flex-wrap:wrap"><a class="b" href="#/produk">Lihat Promo</a><a class="b s" href="${waLink()}">Hubungi Kami</a></div></section><div class="hz"></div>
<div class="ban"><div class="in"><div><div class="sub" style="color:var(--bg)">PAKET HEMAT</div><div class="ttl">${esc(c.banner)}</div><div style="font-size:18px">${esc(c.bannerSub)}</div></div><a class="b" style="background:var(--bg);color:var(--y)" href="#/booking">Ambil Paket</a></div></div>
<section class="wrap" style="padding-top:40px"><h2 class="ttl" style="font-size:44px;margin-bottom:16px">PRODUK TERBARU</h2><div class="g">${db.products.slice(0,4).map(pcard).join('')}</div></section>`}
const pcard=p=>`<div class="c">${p.photos&&p.photos.length?`<button data-a="gal" data-v="${p.id}" aria-label="Lihat foto ${esc(p.name)}" style="padding:0;border:0;background:none;cursor:pointer;position:relative;display:block;width:100%">${img(p.photo,p.name)}${p.photos.length>1?`<span class="tag" style="position:absolute;right:8px;bottom:8px;background:var(--y);color:var(--bg)">${p.photos.length} foto</span>`:''}</button>`:img(p.photo,p.name)}<h3>${esc(p.name)}</h3><div>${rp(p.price)} · ${p.stock>0?'Stok '+p.stock:'<b style="color:#FF8A5C">Habis</b>'}</div><a class="b s sm" href="${waLink()}">Tanya lewat WhatsApp</a></div>`;
const produk=()=>{const q=decodeURIComponent((location.hash.split('q=')[1]||'').split('&')[0]).toLowerCase().trim(),L=q?db.products.filter(p=>(p.name+' '+(p.code||'')).toLowerCase().includes(q)):db.products;
return`<section class="wrap" style="padding-top:40px"><h1 class="ttl" style="font-size:56px;margin-bottom:20px">PRODUK SPAREPART</h1>${q?`<p style="margin-bottom:16px">Hasil pencarian "${esc(q)}": ${L.length} produk. <a href="#/produk" style="color:var(--y)">Hapus pencarian</a></p>`:''}${L.length?`<div class="g">${L.map(pcard).join('')}</div>`:'<p>Produk tidak ditemukan.</p>'}</section>`};
const layanan=()=>`<section class="wrap" style="padding-top:40px"><h1 class="ttl" style="font-size:56px;margin-bottom:20px">LAYANAN SERVIS</h1><div class="g">${db.services.map(s=>`<div class="c">${img(s.photo,s.name)}<h3>${esc(s.name)}</h3><p>${esc(s.desc)}</p><b>Mulai ${rp(s.price)}</b><a class="b sm" href="#/booking?s=${s.id}">Booking</a></div>`).join('')}</div></section>`;
function booking(){
if(S.done){const b=S.done;return`<section class="wrap" style="padding-top:40px;max-width:640px"><div class="c" style="gap:12px"><h1 class="ttl" style="font-size:44px">BOOKING BERHASIL</h1><div class="stat" style="font-size:72px">No. ${b.no}</div><p>${esc(b.name)}, kami tunggu motormu pada <b>${b.date}</b> pukul <b>${b.time}</b> untuk <b>${esc(b.service)}</b>.</p><a class="b" href="#/">Kembali ke beranda</a></div></section>`}
const sid=(location.hash.split('s=')[1]||'');
if(db.cfg.bookingOnline!=='1')return`<section class="wrap" style="padding-top:40px;max-width:760px"><h1 class="ttl" style="font-size:56px;margin-bottom:20px">BOOKING SERVIS</h1><div class="c" style="gap:12px"><p>Pendaftaran servis dilayani langsung oleh kasir di bengkel. Datang ke bengkel atau hubungi kami lewat WhatsApp untuk menanyakan antrean.</p><p><b>${esc(db.cfg.alamat)}</b><br>Jam buka: ${esc(db.cfg.jam)}</p><a class="b" href="${waLink()}" style="align-self:flex-start">Hubungi lewat WhatsApp</a></div></section>`;
return`<section class="wrap" style="padding-top:40px;max-width:760px"><h1 class="ttl" style="font-size:56px;margin-bottom:20px">BOOKING SERVIS</h1><form data-f="book" class="c" style="gap:16px"><div class="row"><div class="f"><label for="n">Nama lengkap</label><input id="n" name="name" required></div><div class="f"><label for="w">Nomor WhatsApp</label><input id="w" name="wa" type="tel" required></div><div class="f"><label for="m">Jenis dan tahun motor</label><input id="m" name="motor" required></div><div class="f"><label for="l">Layanan</label><select id="l" name="sid">${db.services.map(s=>`<option value="${s.id}"${s.id===sid?' selected':''}>${esc(s.name)} (mulai ${rp(s.price)})</option>`).join('')}</select></div><div class="f"><label for="d">Tanggal kedatangan</label><input id="d" name="date" type="date" min="${today()}" value="${today()}" required></div><div class="f"><label for="j">Jam kedatangan</label><input id="j" name="time" type="time" value="09:00" required></div></div><div class="f"><label for="k">Keluhan atau catatan</label><textarea id="k" name="note" rows="3"></textarea></div><button class="b" style="align-self:flex-start">Kirim booking</button></form></section>`}
function login(){return`<div class="hz"></div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));min-height:80vh"><div style="padding:56px;display:flex;flex-direction:column;justify-content:center;gap:20px;background:radial-gradient(ellipse 80% 70% at 20% 30%,#3A2210,var(--bg) 75%)"><a href="#/" class="ttl" style="font-size:64px">LUCAS<span style="color:var(--o)">SHOP</span></a><div class="sub" style="letter-spacing:10px;color:var(--o)">BENGKEL MOTOR</div><div style="height:4px;width:140px;background:var(--y)"></div><p style="max-width:420px;font-size:18px">Masuk untuk mengelola data bengkel, mendaftarkan servis, dan mencatat pembayaran.</p></div><div style="padding:40px;display:flex;align-items:center;justify-content:center"><form data-f="login" class="c" style="width:100%;max-width:480px;padding:32px;gap:16px"><h1 class="ttl" style="font-size:44px">MASUK AKUN</h1><fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px"><legend style="font-size:14px;padding-bottom:6px">Masuk sebagai</legend>${[['admin','Admin','Kelola produk, layanan, laporan.'],['kasir','Kasir','Transaksi penjualan dan antrean.']].map((r,i)=>`<label class="role"><input type="radio" name="role" value="${r[0]}"${i?'':' checked'}><span><b>${r[1]}</b><small>${r[2]}</small></span></label>`).join('')}</fieldset><div class="f"><label for="u">Nama pengguna</label><input id="u" name="u" required autocomplete="username"></div><div class="f"><label for="p">Kata sandi</label><input id="p" name="p" type="password" required autocomplete="current-password"></div><button class="b">Masuk</button><p style="font-size:14px"><a href="#/lupa" style="color:var(--y)">Lupa kata sandi?</a></p></form></div></div><div class="hz"></div>`}

const lupa=()=>`<div class="hz"></div><div class="wrap" style="max-width:520px;padding-top:48px;padding-bottom:48px"><div class="c" style="gap:14px;padding:28px"><h1 class="ttl" style="font-size:44px">LUPA KATA SANDI</h1>${S.sent?'<p>Jika email itu terdaftar, tautan untuk membuat kata sandi baru sudah dikirim. Tautan berlaku 30 menit. Cek juga folder spam.</p>':`<form data-f="lupa" style="display:flex;flex-direction:column;gap:14px"><p>Masukkan email akunmu. Kami kirim tautan untuk membuat kata sandi baru.</p><div class="f"><label for="le">Email</label><input id="le" name="email" type="email" required autocomplete="email"></div><button class="b">Kirim tautan</button></form>`}<a href="#/login" style="color:var(--y)">Kembali ke halaman masuk</a></div></div>`;
const reset=()=>`<div class="hz"></div><div class="wrap" style="max-width:520px;padding-top:48px;padding-bottom:48px"><form data-f="reset" class="c" style="gap:14px;padding:28px"><h1 class="ttl" style="font-size:44px">KATA SANDI BARU</h1><input type="hidden" name="token" value="${esc(decodeURIComponent((location.hash.split('t=')[1]||'').split('&')[0]))}"><div class="f"><label for="n1">Kata sandi baru (minimal 6 karakter)</label><input id="n1" name="password" type="password" minlength="6" required autocomplete="new-password"></div><div class="f"><label for="n2">Ulangi kata sandi baru</label><input id="n2" name="password2" type="password" minlength="6" required autocomplete="new-password"></div><button class="b">Simpan kata sandi</button></form></div>`;
const galHtml=()=>{if(!S.gal)return'';const p=db.products.find(x=>x.id===S.gal.id);if(!p||!p.photos.length)return'';const n=p.photos.length,i=Math.min(S.gal.i,n-1);
return`<div class="ov" data-a="galclose"><div class="gal" data-a="noop" role="dialog" aria-label="Foto ${esc(p.name)}"><img src="${p.photos[i].url}" alt="${esc(p.name)} foto ${i+1}"><div class="th">${p.photos.map((x,j)=>`<button class="${j===i?'on':''}" data-a="galset" data-v="${j}" aria-label="Foto ${j+1}"><img src="${x.url}" alt=""></button>`).join('')}</div><div style="display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap"><button class="b s sm" data-a="galnav" data-d="-1">Sebelumnya</button><b>${esc(p.name)} (${i+1}/${n})</b><button class="b s sm" data-a="galnav" data-d="1">Berikutnya</button><button class="b sm" data-a="galclose">Tutup</button></div></div></div>`};
const notaHtml=()=>{if(!S.nota)return'';const n=S.nota.sale,c=S.nota.cfg;
return`<div class="ov" data-a="notaclose"><div data-a="noop" style="display:flex;flex-direction:column;gap:12px;align-items:center"><div class="paper" id="nota"><div style="text-align:center"><b style="font-size:16px">LUCASSHOP</b><br>Bengkel Motor<br>${esc(c.alamat)}<br>WA ${esc(c.wa)}</div><hr><div>No: ${n.no}<br>${n.date} ${n.time}<br>Kasir: ${esc(n.cashier)}${n.booking?`<br>Reg: ${esc(n.booking.reg_no)}${n.booking.spk_no?' / '+n.booking.spk_no:''}<br>Antrean: No. ${n.booking.no}<br>Pelanggan: ${esc(n.booking.name)}<br>Motor: ${esc(n.booking.motor)}${n.booking.mechanic?'<br>Mekanik: '+esc(n.booking.mechanic):''}`:''}</div><hr>${n.items.map(i=>`<div>${esc(i.name)}</div><div class="r"><span>${i.qty} x ${rp(i.price)}</span><span>${rp(i.qty*i.price)}</span></div>`).join('')}<hr><div class="r"><b>TOTAL</b><b>${rp(n.total)}</b></div><div class="r"><span>Bayar</span><span>${rp(n.paid)}</span></div><div class="r"><span>Kembali</span><span>${rp(n.paid-n.total)}</span></div><hr><div style="text-align:center">Terima kasih</div></div><div class="noprint" style="display:flex;gap:10px"><button class="b" data-a="print">Cetak nota</button><button class="b s" data-a="notaclose">Tutup</button></div></div></div>`};
const billHtml=()=>{if(!S.bill)return'';const b=S.bill,t=b.total;
return`<div class="ov" data-a="billclose"><div class="gal" data-a="noop" style="max-width:640px" role="dialog" aria-label="Tagihan servis"><h2 class="ttl" style="font-size:36px">TAGIHAN ${esc(b.reg_no)}</h2><div>${esc(b.name)} · ${esc(b.motor)}</div><div style="display:flex;justify-content:space-between"><span>Layanan: ${esc(b.svc.name)}</span><span>${rp(b.svc.price)}</span></div>${b.parts.length?b.parts.map(x=>`<div style="display:flex;justify-content:space-between"><span>${esc(x.name)} x ${x.qty}</span><span>${rp(x.price*x.qty)}</span></div>`).join(''):'<small>Tidak ada sparepart yang dipakai.</small>'}<div style="display:flex;justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px"><b>Total biaya (otomatis)</b><b>${rp(t)}</b></div><div class="f"><label for="bpaid">Uang diterima (Rp, kosongkan jika pas)</label><input id="bpaid" type="number" min="0" data-a="bpaid" value="${b.paid||''}"></div><div style="display:flex;justify-content:space-between"><span>Kembalian</span><b id="bkmb">${b.paid>0&&b.paid>=t?rp(b.paid-t):'-'}</b></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b" data-a="billpay">Bayar dan cetak nota</button><button class="b s" data-a="billclose">Batal</button></div></div></div>`};
const spHtml=()=>{if(!S.sp)return'';const s=S.sp;
return`<div class="ov" data-a="spclose"><div class="gal" data-a="noop" style="max-width:640px" role="dialog" aria-label="Sparepart digunakan"><h2 class="ttl" style="font-size:36px">SPAREPART DIGUNAKAN</h2><div>${esc(s.reg_no)} · ${esc(s.name)} · ${esc(s.motor)}</div><div class="f"><label for="spp">Catat sparepart (stok langsung berkurang)</label><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="spp" style="flex:1;min-width:180px">${db.products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)} (${rp(p.price)}, stok ${p.stock})</option>`).join('')}</select><input id="spq" type="number" min="1" value="1" style="width:80px" aria-label="Jumlah"><button class="b s sm" data-a="spadd">Catat</button></div></div>${s.parts.length?s.parts.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(x.name)} x ${x.qty}<br><small>${rp(x.price)} per unit</small></span><button class="b r sm" data-a="spdel" data-v="${x.id}">Hapus</button></div>`).join(''):'<p>Belum ada sparepart dicatat.</p>'}<button class="b s" data-a="spclose">Selesai</button></div></div>`};
const photoMgr=e=>`<div class="c"><h3>Foto produk (${e.photos.length} dari 8)</h3>${e.photos.length?`<div class="g" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">${e.photos.map((x,i)=>`<div style="display:flex;flex-direction:column;gap:6px"><img class="ph" src="${x.url}" alt="Foto ${i+1}"><div style="display:flex;gap:6px;flex-wrap:wrap">${i?`<button class="b s sm" data-a="cover" data-v="${e.id}" data-p="${x.id}">Jadikan sampul</button>`:'<span class="tag">Sampul</span>'}<button class="b r sm" data-a="delph" data-v="${e.id}" data-p="${x.id}">Hapus</button></div></div>`).join('')}</div>`:'<p>Belum ada foto.</p>'}</div>`;

/* ===== panel admin dan kasir ===== */
const TABS={admin:[['dash','Dashboard'],['produk','Sparepart'],['layanan','Layanan'],['pelanggan','Pelanggan'],['laporan','Laporan'],['users','Akun'],['cfg','Pengaturan']],kasir:[['daftar','Pendaftaran'],['antrean','Pekerjaan servis'],['kasir','Penjualan']]};
function panel(role){
const T=TABS[role];if(!T.some(t=>t[0]===S.tab))S.tab=T[0][0];
const body={dash:pDash,daftar:pDaftar,antrean:pAntrean,kasir:pKasir,produk:pProduk,layanan:pLayanan,pelanggan:pPelanggan,laporan:pLaporan,users:pUsers,cfg:pCfg}[S.tab]();
return`<div class="hz"></div><header class="top">${logo()}<span class="tag">${role.toUpperCase()}</span><div class="sp"></div><a class="pill" href="#/">Lihat website</a><button class="pill" data-a="out">Keluar (${esc(me.name)})</button></header><div class="panel"><nav class="side">${T.map(t=>`<button class="pill${S.tab===t[0]?' on':''}" data-a="tab" data-v="${t[0]}">${t[1]}</button>`).join('')}</nav><div class="main">${body}</div></div>`}
function pDash(){const s=S.dash||{low:[]};const k=(l,v)=>`<div class="c"><span>${l}</span><div class="stat">${v}</div></div>`;
return`<h1 class="ttl" style="font-size:44px">DASHBOARD HARI INI</h1><div class="g">${k('Pengunjung website',s.vis||0)}${k('Booking servis',s.bookings||0)}${k('Pendapatan',rp(s.sales))}${k('Stok menipis',s.low.length)}</div>${s.low.length?`<div class="c"><h3>Stok menipis</h3>${s.low.map(p=>`<div>${esc(p.name)}: sisa ${p.stock}</div>`).join('')}</div>`:''}`}
const NEXT={Menunggu:['Dikerjakan','Batal'],Dikerjakan:['Selesai']};
function pAntrean(){const l=S.q||[];
return`<h1 class="ttl" style="font-size:44px">PEKERJAAN SERVIS</h1><div class="f" style="max-width:220px"><label for="qd">Tanggal</label><input id="qd" type="date" value="${S.qd}" data-a="qd"></div>${l.length?`<div class="tw"><table><tr><th>No</th><th>Pendaftaran</th><th>Pelanggan</th><th>Motor</th><th>Layanan</th><th>Status</th><th>Aksi</th></tr>${l.map(b=>`<tr><td><b>${b.no}</b><br><small>${b.time}</small></td><td>${esc(b.reg_no)}${b.spk_no||b.mechanic?`<br><small>${[b.spk_no,b.mechanic].filter(Boolean).map(esc).join(' · ')}</small>`:''}</td><td>${esc(b.name)}<br><small>${esc(b.wa)}</small>${b.note?`<br><small>${esc(b.note)}</small>`:''}</td><td>${esc(b.motor)}</td><td>${esc(b.service)}<br><small>${rp(b.svc_price)}</small></td><td>${(NEXT[b.status]||[]).length?`<select data-a="bst" data-v="${b.id}" aria-label="Status ${esc(b.reg_no)}"><option>${b.status}</option>${NEXT[b.status].map(x=>`<option>${x}</option>`).join('')}</select>`:`<span class="tag">${b.status}</span>`}</td><td style="white-space:nowrap">${b.status==='Dikerjakan'?`<button class="b s sm" data-a="sp" data-v="${b.id}">Sparepart${b.nparts?' ('+b.nparts+')':''}</button>`:''}${b.status==='Selesai'?`<button class="b sm" data-a="bill" data-v="${b.id}">Tagih</button>`:''}${b.status==='Lunas'&&b.sale_id?`<button class="b s sm" data-a="nota" data-v="${b.sale_id}">Cetak nota</button>`:''}${b.status==='Selesai'||b.status==='Lunas'?` <a class="b s sm" target="_blank" rel="noopener" href="${waMsgLink(b)}">Kirim WA</a>${b.wa_sent?' <span class="tag">WA terkirim</span>':''}`:''}</td></tr>`).join('')}</table></div>`:'<p>Tidak ada pekerjaan servis pada tanggal ini.</p>'}`}
function pKasir(){const tot=S.cart.reduce((a,x)=>a+x.price*x.qty,0);
return`<h1 class="ttl" style="font-size:44px">KASIR</h1><div class="row" style="grid-template-columns:2fr 1fr;align-items:start"><div class="g" style="grid-template-columns:repeat(auto-fill,minmax(170px,1fr))">${db.products.map(p=>`<button class="c" style="text-align:left;cursor:pointer;color:var(--t)" data-a="add" data-v="${p.id}"${p.stock<1?' disabled':''}>${img(p.photo,p.name)}<b style="color:var(--y)">${esc(p.name)}</b><span>${rp(p.price)} · stok ${p.stock}</span></button>`).join('')}</div><div class="c" style="position:sticky;top:8px"><h3>Keranjang</h3>${S.cart.length?S.cart.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px"><span>${esc(x.name)}<br><small>${rp(x.price)}</small></span><span><button class="b s sm" data-a="qty" data-v="${x.id}" data-d="-1" aria-label="Kurangi">-</button> ${x.qty} <button class="b s sm" data-a="qty" data-v="${x.id}" data-d="1" aria-label="Tambah">+</button></span></div>`).join(''):'<p>Pilih produk di sebelah kiri.</p>'}<hr style="border:0;border-top:1px solid var(--bd);width:100%"><div style="display:flex;justify-content:space-between"><b>Total</b><b>${rp(tot)}</b></div><div class="f"><label for="paid">Uang diterima (Rp, kosongkan jika pas)</label><input id="paid" type="number" min="0" data-a="paid" value="${S.paid||''}"></div><div style="display:flex;justify-content:space-between"><span>Kembalian</span><b id="kmb">${S.paid>0&&S.paid>=tot?rp(S.paid-tot):'-'}</b></div><button class="b" data-a="pay"${S.cart.length?'':' disabled'}>Bayar dan cetak nota</button></div></div>`}
function pForm(kind){const L=kind==='produk'?db.products:db.services,e=L.find(x=>String(x.id)===String(S.edit))||{};
return`<h1 class="ttl" style="font-size:44px">${kind==='produk'?'KELOLA PRODUK':'KELOLA LAYANAN'}</h1><form data-f="${kind}" class="c" style="gap:14px"><h3>${e.id?'Ubah':'Tambah'} ${kind}</h3><div class="row"><div class="f"><label for="a0">Kode ${kind==='produk'?'sparepart':'layanan'}</label><input id="a0" name="code" required value="${esc(e.code)}"></div><div class="f"><label for="a1">Nama</label><input id="a1" name="name" required value="${esc(e.name)}"></div><div class="f"><label for="a2">Harga (Rp)</label><input id="a2" name="price" type="number" min="0" required value="${e.price??''}"></div>${kind==='produk'?`<div class="f"><label for="a3">Stok</label><input id="a3" name="stock" type="number" min="0" required value="${e.stock??''}"></div>`:`<div class="f"><label for="a3">Deskripsi</label><input id="a3" name="desc" value="${esc(e.desc)}"></div>`}${kind==='produk'?'<div class="f"><label for="a4">Foto (boleh pilih banyak, maksimal 8)</label><input id="a4" name="photos" type="file" accept="image/*" multiple></div>':'<div class="f"><label for="a4">Foto (pilih file)</label><input id="a4" name="photo" type="file" accept="image/*"></div>'}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b">Simpan</button>${e.id?'<button type="button" class="b s" data-a="cancel">Batal ubah</button>':''}</div></form>${kind==='produk'&&e.id?photoMgr(e):''}<div class="tw"><table><tr><th>Foto</th><th>Kode</th><th>Nama</th><th>Harga</th><th>${kind==='produk'?'Stok':'Deskripsi'}</th><th>Aksi</th></tr>${L.map(x=>`<tr><td style="width:90px">${img(x.photo,x.name)}${x.photos&&x.photos.length>1?`<small>${x.photos.length} foto</small>`:''}</td><td>${esc(x.code)}</td><td>${esc(x.name)}</td><td>${rp(x.price)}</td><td>${kind==='produk'?x.stock:esc(x.desc)}</td><td style="white-space:nowrap"><button class="b s sm" data-a="edit" data-v="${x.id}">Ubah</button> <button class="b r sm" data-a="del" data-k="${kind}" data-v="${x.id}">Hapus</button></td></tr>`).join('')}</table></div>`}
const pProduk=()=>pForm('produk'),pLayanan=()=>pForm('layanan');
function pDaftar(){const F=S.regF||{},C=S.cust||[],cid=S.regCust||'',cu=C.find(x=>String(x.id)===String(cid)),newV=!cu||S.regVeh==='',v=k=>esc(F[k]||'');
return`<h1 class="ttl" style="font-size:44px">PENDAFTARAN SERVIS</h1><form data-f="svcreg" class="c" style="gap:16px;max-width:860px"><div class="f"><label for="rc">Pelanggan</label><select id="rc" name="customer_id" data-a="regcust"><option value="">Pelanggan baru</option>${C.map(c=>`<option value="${c.id}"${String(c.id)===String(cid)?' selected':''}>${esc(c.code)} · ${esc(c.name)} · ${esc(c.phone)}</option>`).join('')}</select></div>${cu?'':`<div class="row"><div class="f"><label for="rn1">Nama pelanggan</label><input id="rn1" name="cname" required value="${v('cname')}"></div><div class="f"><label for="rn2">Nomor telepon</label><input id="rn2" name="cphone" type="tel" required value="${v('cphone')}"></div><div class="f"><label for="rn3">Alamat</label><input id="rn3" name="caddress" value="${v('caddress')}"></div></div>`}${cu&&cu.vehicles.length?`<div class="f"><label for="rv">Kendaraan</label><select id="rv" name="vehicle_id" data-a="regveh">${cu.vehicles.map(x=>`<option value="${x.id}"${String(x.id)===String(S.regVeh)?' selected':''}>${esc(x.label)}</option>`).join('')}<option value=""${S.regVeh===''?' selected':''}>Kendaraan baru</option></select></div>`:''}${newV?`<div class="row"><div class="f"><label for="rk1">Plat nomor</label><input id="rk1" name="plate" value="${v('plate')}"></div><div class="f"><label for="rk2">Merk</label><input id="rk2" name="brand" value="${v('brand')}"></div><div class="f"><label for="rk3">Tipe</label><input id="rk3" name="type" required value="${v('type')}"></div><div class="f"><label for="rk4">Tahun</label><input id="rk4" name="year" type="number" min="1980" value="${v('year')}"></div></div>`:''}<div class="row"><div class="f"><label for="rs">Layanan servis</label><select id="rs" name="sid">${db.services.map(s=>`<option value="${s.id}"${String(s.id)===String(F.sid)?' selected':''}>${esc(s.code)} · ${esc(s.name)} (${rp(s.price)})</option>`).join('')}</select></div><div class="f"><label for="rd2">Tanggal</label><input id="rd2" name="date" type="date" min="${today()}" value="${esc(F.date||today())}" required></div><div class="f"><label for="rm2">Mekanik (opsional)</label><input id="rm2" name="mechanic" value="${v('mechanic')}"></div></div><div class="f"><label for="rkl">Keluhan</label><textarea id="rkl" name="note" rows="3">${v('note')}</textarea></div><button class="b" style="align-self:flex-start">Simpan pendaftaran</button></form>`}
function pPelanggan(){const C=S.cust||[],e=C.find(x=>String(x.id)===String(S.editC))||{};
return`<h1 class="ttl" style="font-size:44px">DATA PELANGGAN</h1><form data-f="cust" class="c" style="gap:14px"><h3>${e.id?'Ubah':'Tambah'} pelanggan</h3><div class="row"><div class="f"><label for="c1">Nama</label><input id="c1" name="name" required value="${esc(e.name)}"></div><div class="f"><label for="c2">Nomor telepon</label><input id="c2" name="phone" type="tel" required value="${esc(e.phone)}"></div><div class="f"><label for="c3">Alamat</label><input id="c3" name="address" value="${esc(e.address)}"></div></div>${e.id?'':`<h3>Kendaraan pertama (opsional)</h3><div class="row"><div class="f"><label for="c4">Plat nomor</label><input id="c4" name="plate"></div><div class="f"><label for="c5">Merk</label><input id="c5" name="brand"></div><div class="f"><label for="c6">Tipe</label><input id="c6" name="type"></div><div class="f"><label for="c7">Tahun</label><input id="c7" name="year" type="number" min="1980"></div></div>`}<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b">Simpan</button>${e.id?'<button type="button" class="b s" data-a="cancel">Batal ubah</button>':''}</div></form>${e.id?`<div class="c"><h3>Kendaraan ${esc(e.name)}</h3>${e.vehicles.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${esc(v.label)}</span><button class="b r sm" data-a="del" data-k="veh" data-v="${v.id}">Hapus</button></div>`).join('')||'<p>Belum ada kendaraan.</p>'}<form data-f="veh" class="row" style="align-items:end"><div class="f"><label for="v1">Plat</label><input id="v1" name="plate"></div><div class="f"><label for="v2">Merk</label><input id="v2" name="brand"></div><div class="f"><label for="v3">Tipe</label><input id="v3" name="type" required></div><div class="f"><label for="v4">Tahun</label><input id="v4" name="year" type="number" min="1980"></div><button class="b sm">Tambah kendaraan</button></form></div><div class="c"><h3>Riwayat servis</h3>${(S.hist||[]).length?`<div class="tw"><table><tr><th>Pendaftaran</th><th>Tanggal</th><th>Motor</th><th>Layanan</th><th>Status</th><th>Total</th></tr>${S.hist.map(h=>`<tr><td>${esc(h.reg_no)}</td><td>${h.date}</td><td>${esc(h.motor)}</td><td>${esc(h.service)}</td><td><span class="tag">${h.status}</span></td><td>${h.total?rp(h.total):'-'}</td></tr>`).join('')}</table></div>`:'<p>Belum ada riwayat servis.</p>'}</div>`:''}<div class="tw"><table><tr><th>Kode</th><th>Nama</th><th>Telepon</th><th>Kendaraan</th><th>Aksi</th></tr>${C.map(c=>`<tr><td>${esc(c.code)}</td><td>${esc(c.name)}<br><small>${esc(c.address)}</small></td><td>${esc(c.phone)}</td><td>${c.vehicles.map(v=>esc(v.label)).join('<br>')||'-'}</td><td style="white-space:nowrap"><button class="b s sm" data-a="editc" data-v="${c.id}">Ubah</button> <button class="b r sm" data-a="del" data-k="cust" data-v="${c.id}">Hapus</button></td></tr>`).join('')}</table></div>`}
function pLaporan(){const r=S.rep;if(!r)return'<p>Memuat laporan...</p>';const day=r.mode==='day';
return`<h1 class="ttl noprint" style="font-size:44px">LAPORAN</h1><div class="noprint" style="display:flex;gap:16px;align-items:end;flex-wrap:wrap"><div class="f"><label for="rmode">Periode</label><select id="rmode" data-a="rmode"><option value="day"${day?' selected':''}>Harian</option><option value="month"${day?'':' selected'}>Bulanan</option></select></div><div class="f"><label for="rp1">${day?'Tanggal':'Bulan'}</label>${day?`<input id="rp1" type="date" value="${S.rd}" data-a="rd">`:`<input id="rp1" type="month" value="${S.rm}" data-a="rm">`}</div><button class="b s" data-a="printrpt">Cetak laporan</button></div><div class="rpt" style="display:flex;flex-direction:column;gap:20px"><div><h2 class="ttl" style="font-size:34px">LAPORAN KEUANGAN DAN SERVIS</h2><div>Lucasshop Bengkel Motor · Periode ${day?'harian':'bulanan'}: ${esc(r.label)}</div></div><div class="g"><div class="c"><span>Pendapatan</span><div class="stat">${rp(r.total)}</div><small>${r.sales} transaksi</small></div><div class="c"><span>Dari servis</span><div class="stat">${rp(r.svc)}</div></div><div class="c"><span>Dari penjualan sparepart</span><div class="stat">${rp(r.prod)}</div></div><div class="c"><span>Pengunjung website</span><div class="stat">${r.vis}</div></div></div><div class="c"><h3>Laporan servis</h3><p>Total pendaftaran: <b>${r.book.total}</b> · ${ST.map(x=>x+': '+(r.book[x]||0)).join(' · ')}</p><h3 style="font-size:18px">Sparepart digunakan pada servis</h3>${r.parts.length?`<div class="tw"><table><tr><th>Sparepart</th><th>Jumlah</th><th>Nilai</th></tr>${r.parts.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.q}</td><td>${rp(i.t)}</td></tr>`).join('')}</table></div>`:'<p>Tidak ada pemakaian sparepart pada periode ini.</p>'}</div><div class="c"><h3>Rincian pendapatan</h3>${r.items.length?`<div class="tw"><table><tr><th>Item</th><th>Jumlah</th><th>Pendapatan</th></tr>${r.items.map(i=>`<tr><td>${esc(i.name)}</td><td>${i.q}</td><td>${rp(i.t)}</td></tr>`).join('')}</table></div>`:'<p>Belum ada pendapatan pada periode ini.</p>'}</div>${day?`<div class="c"><h3>Transaksi</h3>${r.trx.length?`<div class="tw"><table><tr><th>No</th><th>Jam</th><th>Jenis</th><th>Kasir</th><th>Total</th></tr>${r.trx.map(t=>`<tr><td>#${t.id}</td><td>${t.time}</td><td>${t.type}</td><td>${esc(t.cashier)}</td><td>${rp(t.total)}</td></tr>`).join('')}</table></div>`:'<p>Belum ada transaksi.</p>'}</div>`:''}<div class="c"><h3>${day?'7 hari terakhir':'Per hari'}</h3><div class="tw"><table><tr><th>Tanggal</th><th>Pengunjung</th><th>Pendaftaran servis</th><th>Pendapatan</th></tr>${r.daily.map(x=>`<tr><td>${x.date}</td><td>${x.vis}</td><td>${x.book}</td><td>${rp(x.total)}</td></tr>`).join('')}</table></div></div></div>`}
function pUsers(){const U=S.users||[],e=U.find(x=>String(x.id)===String(S.editU));
return`<h1 class="ttl" style="font-size:44px">AKUN PENGGUNA</h1><form data-f="user" class="c" style="gap:14px"><h3>${e?'Ubah akun '+esc(e.username):'Tambah akun staf'}</h3><div class="row"><div class="f"><label for="u1">Nama</label><input id="u1" name="name" required value="${e?esc(e.name):''}"></div>${e?'':`<div class="f"><label for="u2">Nama pengguna</label><input id="u2" name="username" required></div><div class="f"><label for="u5">Email (untuk reset kata sandi)</label><input id="u5" name="email" type="email"></div><div class="f"><label for="u3">Kata sandi (minimal 6 karakter)</label><input id="u3" name="password" type="password" minlength="6" required></div>`}${!e||e.role!=='pengunjung'?`<div class="f"><label for="u4">Peran</label><select id="u4" name="role"><option value="kasir"${e&&e.role==='kasir'?' selected':''}>Kasir</option><option value="admin"${e&&e.role==='admin'?' selected':''}>Admin</option></select></div>`:''}</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b">${e?'Simpan perubahan':'Tambah akun'}</button>${e?'<button type="button" class="b s" data-a="cancel">Batal ubah</button>':''}</div></form><div class="tw"><table><tr><th>Nama</th><th>Pengguna</th><th>Email</th><th>Peran</th><th>Status</th><th>Aksi</th></tr>${U.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${esc(u.email||'-')}</td><td><span class="tag">${u.role}</span></td><td>${u.active?'Aktif':'<b style="color:#FF8A5C">Nonaktif</b>'}</td><td style="white-space:nowrap"><button class="b s sm" data-a="editu" data-v="${u.id}">Ubah</button> <button class="b s sm" data-a="mail" data-v="${u.id}" data-m="${esc(u.email||'')}">Ubah email</button> <button class="b s sm" data-a="pw" data-v="${u.id}">Ganti sandi</button>${u.id!==me.id?` <button class="b ${u.active?'r':''} sm" data-a="uact" data-v="${u.id}" data-x="${u.active?0:1}">${u.active?'Nonaktifkan':'Aktifkan'}</button>`:''}</td></tr>`).join('')}</table></div>`}
function pCfg(){const c=db.cfg,F=[['hero','Judul utama beranda'],['banner','Judul banner promo'],['bannerSub','Keterangan banner'],['alamat','Alamat bengkel'],['wa','Nomor WhatsApp (contoh 62812xxxx)'],['email','Email'],['jam','Jam buka'],['waDone','Pesan WhatsApp saat motor selesai (pakai {nama} {motor} {layanan} {jam})']];
return`<h1 class="ttl" style="font-size:44px">PENGATURAN</h1><form data-f="cfg" class="c" style="gap:14px;max-width:640px">${F.map(f=>`<div class="f"><label for="c_${f[0]}">${f[1]}</label><input id="c_${f[0]}" name="${f[0]}" value="${esc(c[f[0]])}"></div>`).join('')}<div class="f"><label for="c_bookingOnline">Booking servis online dari website</label><select id="c_bookingOnline" name="bookingOnline"><option value="0"${c.bookingOnline!=='1'?' selected':''}>Nonaktif (pendaftaran lewat kasir saja)</option><option value="1"${c.bookingOnline==='1'?' selected':''}>Aktif (pengunjung boleh mengirim booking)</option></select></div><button class="b" style="align-self:flex-start">Simpan pengaturan</button></form><div class="c" style="max-width:640px"><h3>Data</h3><p>Data tersimpan di server dalam file database SQLite. Unduh cadangan secara berkala.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="b s" data-a="export">Unduh cadangan database</button></div></div>`}

/* ===== router ===== */
const route=()=>location.hash.slice(2).split('?')[0]||'home';
const go=h=>{if(location.hash===h)draw();else location.hash=h};
let idleT=null,idleMin=30;
function armIdle(){clearTimeout(idleT);if(!me)return;idleT=setTimeout(async()=>{try{await api('/api/logout',{m:'POST',b:{}})}catch(e){}me=null;S.tab='dash';toast('Sesi berakhir karena tidak aktif. Silakan masuk lagi.');go('#/login')},idleMin*6e4)}
['click','keydown','input','pointerdown'].forEach(ev=>addEventListener(ev,armIdle,{passive:true}));
async function load(p){
const m=await api('/api/me');me=m.user;idleMin=m.idleMin||30;armIdle();
Object.assign(db,await api('/api/public'));
try{if(!sessionStorage.getItem('lv')){sessionStorage.setItem('lv','1');api('/api/visit',{m:'POST',b:{}})}}catch(e){}
if((p==='admin'||p==='kasir')&&me&&me.role===p){
if(!TABS[p].some(t=>t[0]===S.tab))S.tab=TABS[p][0][0];
const t=S.tab;
if(t==='dash')S.dash=await api('/api/dashboard');
if(t==='antrean')S.q=(await api('/api/bookings?date='+S.qd)).rows;
if(t==='daftar'||t==='pelanggan')S.cust=(await api('/api/customers')).rows;
if(t==='pelanggan'&&S.editC)S.hist=(await api('/api/customers/'+S.editC+'/history')).rows;
if(t==='laporan')S.rep=await api('/api/report?mode='+S.rmode+'&date='+S.rd+'&month='+S.rm);
if(t==='users')S.users=(await api('/api/users')).rows}}
function paint(p){
if((p==='admin'||p==='kasir')&&(!me||me.role!==p)){location.hash='#/login';return}
$('#app').innerHTML=((p==='admin'||p==='kasir')?panel(p):p==='login'?login():p==='lupa'?lupa():p==='reset'?reset():navbar(p)+({home,produk,layanan,booking}[p]||home)()+foot())+galHtml()+billHtml()+spHtml()+notaHtml()}
async function refresh(){const p=route(),y=scrollY;try{await load(p)}catch(e){}paint(p);scrollTo(0,y)}
async function draw(){await refresh();scrollTo(0,0)}
function repaint(){const y=scrollY;paint(route());scrollTo(0,y)}
const closeAll=()=>{S.gal=null;S.nota=null;S.bill=null;S.sp=null};
addEventListener('hashchange',()=>{S.done=null;S.sent=false;closeAll();draw()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.gal||S.nota||S.bill||S.sp)){const w=S.sp;closeAll();if(w)refresh();else repaint()}});
addEventListener('afterprint',()=>document.body.classList.remove('pr'));
document.addEventListener('input',e=>{const el=e.target,a=el.dataset&&el.dataset.a;
if(a==='bpaid'&&S.bill){S.bill.paid=+el.value||0;const k=$('#bkmb');if(k)k.textContent=S.bill.paid>0&&S.bill.paid>=S.bill.total?rp(S.bill.paid-S.bill.total):'-'}
if(a==='paid'){S.paid=+el.value||0;const t=S.cart.reduce((x,i)=>x+i.price*i.qty,0),k=$('#kmb');if(k)k.textContent=S.paid>0&&S.paid>=t?rp(S.paid-t):'-'}});
document.addEventListener('submit',async e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const d=Object.fromEntries(new FormData(e.target));
try{
if(f==='login'){me=(await api('/api/login',{m:'POST',b:d})).user;go('#/'+me.role);return}
if(f==='search'){go('#/produk?q='+encodeURIComponent(d.q||''));return}
if(f==='book'){S.done=await api('/api/bookings',{m:'POST',b:d});await refresh();return}
if(f==='lupa'){await api('/api/forgot',{m:'POST',b:d});S.sent=true;repaint();return}
if(f==='reset'){if(d.password!==d.password2){toast('Kata sandi dan ulangannya berbeda.');return}await api('/api/reset',{m:'POST',b:{token:d.token,password:d.password}});toast('Kata sandi diganti. Silakan masuk.');go('#/login');return}
if(f==='cfg'){await api('/api/config',{m:'PUT',b:d});toast('Pengaturan disimpan');return}
if(f==='svcreg'){const veh={plate:d.plate,brand:d.brand,type:d.type,year:d.year},b={service_id:d.sid,date:d.date,note:d.note,mechanic:d.mechanic};
if(d.customer_id){b.customer_id=d.customer_id;if(d.vehicle_id)b.vehicle_id=d.vehicle_id;else b.vehicle=veh}else{b.customer={name:d.cname,phone:d.cphone,address:d.caddress};b.vehicle=veh}
const r=await api('/api/registrations',{m:'POST',b});S.regF={};S.regCust='';S.regVeh=undefined;S.tab='antrean';S.qd=r.date;toast('Terdaftar: '+r.reg_no+' · antrean No. '+r.no);await refresh();return}
if(f==='cust'){if(S.editC)await api('/api/customers/'+S.editC,{m:'PUT',b:d});else await api('/api/customers',{m:'POST',b:{name:d.name,phone:d.phone,address:d.address,vehicle:{plate:d.plate,brand:d.brand,type:d.type,year:d.year}}});S.editC=null;toast('Tersimpan');await refresh();return}
if(f==='veh'){await api('/api/customers/'+S.editC+'/vehicles',{m:'POST',b:d});toast('Kendaraan ditambahkan');await refresh();return}
if(f==='user'){if(S.editU)await api('/api/users/'+S.editU,{m:'PUT',b:{name:d.name,role:d.role}});else await api('/api/users',{m:'POST',b:d});S.editU=null;toast('Tersimpan');await refresh();return}
if(f==='produk'||f==='layanan'){const b={code:d.code,name:d.name,price:d.price};if(f==='produk')b.stock=d.stock;else{b.desc=d.desc;const file=e.target.querySelector('[name=photo]').files[0];if(file)b.photo=await resize(file)}
const r=await api('/api/'+(f==='produk'?'products':'services')+(S.edit?'/'+S.edit:''),{m:S.edit?'PUT':'POST',b});
if(f==='produk'){const id=S.edit||r.id;for(const file of e.target.querySelector('[name=photos]').files){try{await api('/api/products/'+id+'/photos',{m:'POST',b:{photo:await resize(file)}})}catch(x){break}}}
S.edit=null;toast('Tersimpan');await refresh()}
}catch(err){}});
document.addEventListener('click',async e=>{const el=e.target.closest('[data-a]');if(!el||['INPUT','SELECT'].includes(el.tagName))return;const a=el.dataset.a,v=el.dataset.v;
try{
if(a==='out'){await api('/api/logout',{m:'POST',b:{}});me=null;S.tab='dash';S.cart=[];closeAll();go('#/')}
else if(a==='tab'){S.tab=v;S.edit=null;S.editC=null;S.editU=null;await refresh()}
else if(a==='edit'){S.edit=v;repaint();scrollTo(0,0)}
else if(a==='editc'){S.editC=v;await refresh();scrollTo(0,0)}
else if(a==='editu'){S.editU=v;repaint();scrollTo(0,0)}
else if(a==='cancel'){S.edit=null;S.editC=null;S.editU=null;repaint()}
else if(a==='del'){if(confirm('Hapus data ini? Tindakan ini tidak bisa dibatalkan.')){await api('/api/'+{produk:'products',layanan:'services',cust:'customers',veh:'vehicles'}[el.dataset.k]+'/'+v,{m:'DELETE'});await refresh()}}
else if(a==='uact'){await api('/api/users/'+v+'/active',{m:'PUT',b:{active:+el.dataset.x}});await refresh()}
else if(a==='pw'){const p=prompt('Kata sandi baru (minimal 6 karakter):');if(p){await api('/api/users/'+v+'/password',{m:'PUT',b:{password:p}});toast('Kata sandi diganti')}}
else if(a==='mail'){const m=prompt('Email baru (kosongkan untuk menghapus):',el.dataset.m||'');if(m!==null){await api('/api/users/'+v+'/email',{m:'PUT',b:{email:m}});await refresh()}}
else if(a==='add'){const p=db.products.find(x=>x.id===+v),c=S.cart.find(x=>x.id===+v);if(c){if(c.qty<p.stock)c.qty++}else S.cart.push({id:p.id,name:p.name,price:p.price,qty:1});repaint()}
else if(a==='qty'){const c=S.cart.find(x=>x.id===+v),p=db.products.find(x=>x.id===+v);c.qty+=+el.dataset.d;if(c.qty>p.stock)c.qty=p.stock;if(c.qty<1)S.cart=S.cart.filter(x=>x.id!==+v);repaint()}
else if(a==='pay'){const r=await api('/api/sales',{m:'POST',b:{items:S.cart.map(x=>({id:x.id,qty:x.qty})),paid:S.paid||''}});S.cart=[];S.paid=0;S.nota=await api('/api/sales/'+r.id);toast('Transaksi tersimpan');await refresh()}
else if(a==='sp'){const b=(S.q||[]).find(x=>x.id===+v);S.sp={id:b.id,reg_no:b.reg_no,name:b.name,motor:b.motor,parts:(await api('/api/bookings/'+b.id+'/parts')).rows};repaint()}
else if(a==='spadd'){S.sp.parts=(await api('/api/bookings/'+S.sp.id+'/parts',{m:'POST',b:{product_id:$('#spp').value,qty:$('#spq').value}})).rows;Object.assign(db,await api('/api/public'));repaint()}
else if(a==='spdel'){S.sp.parts=(await api('/api/bookings/'+S.sp.id+'/parts/'+v,{m:'DELETE'})).rows;Object.assign(db,await api('/api/public'));repaint()}
else if(a==='spclose'){S.sp=null;await refresh()}
else if(a==='bill'){const b=(S.q||[]).find(x=>x.id===+v),bl=await api('/api/bookings/'+b.id+'/bill');S.bill={id:b.id,reg_no:b.reg_no,name:b.name,motor:b.motor,svc:bl.svc,parts:bl.parts,total:bl.total,paid:0};repaint()}
else if(a==='billpay'){const b=S.bill,r=await api('/api/bookings/'+b.id+'/bill',{m:'POST',b:{paid:b.paid||''}});S.bill=null;S.nota=await api('/api/sales/'+r.id);toast('Pembayaran tersimpan. Status Lunas.');await refresh()}
else if(a==='billclose'){S.bill=null;repaint()}
else if(a==='nota'){S.nota=await api('/api/sales/'+v);repaint()}
else if(a==='notaclose'){S.nota=null;repaint()}
else if(a==='print'){api('/api/sales/'+S.nota.sale.id+'/printed',{m:'POST',b:{}}).catch(()=>{});window.print()}
else if(a==='printrpt'){document.body.classList.add('pr');window.print()}
else if(a==='gal'){S.gal={id:+v,i:0};repaint()}
else if(a==='galset'){S.gal.i=+v;repaint()}
else if(a==='galnav'){const n=db.products.find(x=>x.id===S.gal.id).photos.length;S.gal.i=(S.gal.i+(+el.dataset.d)+n)%n;repaint()}
else if(a==='galclose'){S.gal=null;repaint()}
else if(a==='delph'){if(confirm('Hapus foto ini?')){await api('/api/products/'+v+'/photos/'+el.dataset.p,{m:'DELETE'});await refresh()}}
else if(a==='cover'){await api('/api/products/'+v+'/photos/'+el.dataset.p+'/cover',{m:'PUT',b:{}});await refresh()}
else if(a==='export'){location.href='/api/backup'}
}catch(err){}});
document.addEventListener('change',async e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
try{if(a==='qd'){S.qd=el.value;await refresh()}else if(a==='rd'){S.rd=el.value;await refresh()}else if(a==='rm'){S.rm=el.value;await refresh()}else if(a==='rmode'){S.rmode=el.value;await refresh()}
else if(a==='bst'){try{await api('/api/bookings/'+el.dataset.v,{m:'PATCH',b:{status:el.value}});toast('Status diperbarui')}finally{await refresh()}}
else if(a==='regcust'){S.regF=Object.fromEntries(new FormData(el.closest('form')));S.regCust=el.value;const cu=(S.cust||[]).find(x=>String(x.id)===el.value);S.regVeh=cu&&cu.vehicles.length?String(cu.vehicles[0].id):'';repaint()}
else if(a==='regveh'){S.regF=Object.fromEntries(new FormData(el.closest('form')));S.regVeh=el.value;repaint()}}catch(err){}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a=srch],[data-a=menu]');if(!el)return;if(el.dataset.a==='srch'){const f=$('#sform');f.classList.toggle('open');if(f.classList.contains('open'))f.q.focus()}else $('#mnav').classList.toggle('open')});
draw();
</script>
</body>
